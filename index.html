<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        /* Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1;
        }

        /* Centered Content */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .header-container {
            margin-bottom: 40px;
        }

        .header {
            font-size: 4em;
            font-weight: bold;
        }

        .sub-header {
            font-size: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .sub-header .static-text {
            color: white;
        }

        .sub-header .animated-text {
            color: #2ecc71;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #2ecc71;
            width: 14ch;
            animation: typing 4s steps(14) infinite, blink 0.7s infinite;
        }

        @keyframes typing {
            0% { width: 0; }
            40% { width: 14ch; }
            60% { width: 14ch; }
            100% { width: 0; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.5em;
            margin-top: 30px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s;
        }

        .navbar a::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0%;
            height: 2px;
            background-color: #fd9800;
            transition: width 0.3s ease-in-out, left 0.3s ease-in-out;
        }

        .navbar a:hover {
            color: #2ecc71;
        }

        .navbar a:hover::after {
            width: 100%;
            left: 0;
        }

        /* Social Links */
        .social-links {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .social-links a {
            display: inline-block;
            width: 50px;
            height: 50px;
            background: #1e1e1e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            text-decoration: none;
            transition: background 0.3s;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }
        .card img {
                width: 30px;
                height: 30px;
        }


        .social-links a:hover {
            background: #2ecc71;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .header {
                font-size: 3em;
            }
            .sub-header {
                font-size: 1.8em;
            }
            .navbar {
                font-size: 1.2em;
            }
            .social-links {
                gap: 15px;
            }
            .social-links a {
                width: 40px;
                height: 40px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <div class="video-container">
        <video autoplay loop muted>
            <source src="Portfolio.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Content Container -->
    <div class="container">
        <!-- Name and Sub-header (Centered) -->
        <div class="header-container">
            <div class="header">Akash S</div>
            <div class="sub-header">
                <span class="static-text">I'm </span>
                <span class="animated-text">Game Developer</span>
            </div>
        </div>

        <!-- Navbar Below -->
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="About.html">About</a>
            <a href="Project.html">Projects</a>
            <a href="#">Resume</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </div>

    <!-- Social Links at the Bottom -->
    <div class="card">
        <div class="social-links">
            <a href="https://www.linkedin.com/in/akash-srinivasan-3a59a7203/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base%3BuoVrJLCCRkOUQapYmK1Omg%3D%3D"title="LinkedIn"><img src="https://img.icons8.com/?size=100&id=13930&format=png&color=000000" alt="LinkedIn">
            <a href="https://github.com/AkashSPARTA"title="GitHub"><img src="https://img.icons8.com/?size=100&id=3tC9EQumUAuq&format=png&color=000000" alt="GitHub">
            <a href="mailto:akashsrinivasa169@gmail.com" title="Gmail"><img src="https://img.icons8.com/?size=100&id=P7UIlhbpWzZm&format=png&color=000000" alt="Gmail"></a>
        </div>
    </div>

</body>
</html>
