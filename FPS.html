<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Game</title>
    <style>
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-rendering: optimizeLegibility;
            image-rendering: crisp-edges;
        }
        
        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 15px 30px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 100;
        }
        .navbar .name {
            color: white;
            font-weight: bold;
            font-size: 1.5em;
            text-align: center;
            flex-grow: 1;
        }
        .back-button {
            background-color: #2ecc71;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .back-button:hover {
            background-color: #e07b00;
        }
        
        /* Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1;
        }
        
        /* Content Section */
        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 80px;
            padding: 20px;
        }
        
        /* Game Videos */
        .game-videos {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(30, 41, 59, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 90%;
        }
        .game-videos h2, .game-videos h3 {
            color: #2ecc71;
            font-size: 1.5em;
            margin-bottom: 10px;
            text-align: center;
        }
        .game-videos video {
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 20px;
            }
            .navbar .name {
                font-size: 1.2em;
            }
            .back-button {
                font-size: 0.8em;
                padding: 8px 12px;
            }
            .content-section {
                margin-top: 70px;
                padding: 10px;
            }
            .game-videos {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <a href="Project.html" class="back-button">Back</a>
        <div class="name">FPS Game</div>
    </div>
    
    <!-- Background Video -->
    <div class="video-container">
        <video autoplay loop muted>
            <source src="Portfolio.mp4" type="video/mp4">
        </video>
    </div>
    
    <!-- Game Videos -->
    <div class="content-section">
        <div class="game-videos">
            <h2>Game Videos</h2>
            <h3>Work in Process...</h3>
            <video controls>
                <source src="FPS Game.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</body>
</html>
