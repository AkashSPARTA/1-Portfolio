<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Akash S</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
            background: #1e293b;
            padding: 15px 20px;
        }
        .navbar .name {
            color: white;
            font-weight: bold;
            font-size: 1.5em;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #2ecc71;
        }
        .nav-links a.active {
            color: #2ecc71;
        }
        /* Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1;
        }
        /* Project Tabs */
        .project-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 100px;
            padding: 20px;
        }
        .project-tabs a {
            background: #1e293b;
            color: white;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 15px;
            transition: transform 0.2s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 280px;
        }
        .project-tabs a img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }
        .project-tabs a:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 15px rgba(7, 216, 24, 0.8);
        }
        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 10px;
            }
            .nav-links {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .project-tabs {
                flex-direction: column;
                align-items: center;
                margin-top: 50px;
            }
            .project-tabs a {
                width: 90%;
                max-width: 300px;
            }
            .project-tabs a img {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="name">Akash S</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="About.html">About</a>
            <a href="projects.html" class="active">Projects</a>
            <a href="resume.html">Resume</a>
            <a href="Contact.html">Contact</a>
        </div>
    </div>
    
    <!-- Background Video -->
    <div class="video-container">
        <video autoplay loop muted>
            <source src="Portfolio.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Project Section -->
    <div class="project-tabs">
        <a href="SpaceGame.html">
            <img src="Spacegame.png" alt="Space Game">
            <span>Space Game</span>
        </a>
        <a href="DesertRunner.html">
            <img src="DesserRun.png" alt="Desert Run">
            <span>Desert Run</span>
        </a>
        <a href="CarRace.html">
            <img src="Carrace.png" alt="Car Race">
            <span>Car Race</span>
        </a>
        <a href="FPS.html">
            <img src="FPS.png" alt="FPS Game">
            <span>FPS Game</span>
        </a>
    </div>
</body>
</html>
