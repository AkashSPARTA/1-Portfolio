<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game</title>
    <style>
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-rendering: optimizeLegibility;
            image-rendering: crisp-edges;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 15px 30px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
        }
        .navbar .name {
            color: white;
            font-weight: bold;
            font-size: 1.5em;
            text-align: center;
            flex: 1;
        }
        .back-button {
            background-color: #2ecc71;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.8em;
        }
        .back-button:hover {
            background-color: #e07b00;
        }
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1;
        }
        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 80px;
            padding: 20px;
        }
        .game-screenshots, .game-videos {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 40px;
        }
        .screenshot-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .screenshot-container img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
        }
        .game-videos video {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="Project.html" class="back-button">Back</a>
        <div class="name">Space Game</div>
    </div>
    
    <div class="video-container">
        <video autoplay loop muted>
            <source src="Portfolio.mp4" type="video/mp4">
        </video>
    </div>

    <div class="content-section">
        <div class="game-screenshots">
            <h2>Game Screenshots</h2>
            <div class="screenshot-container">
                <img src="Spacegamemain.png" alt="Image 1" onclick="openModal(this.src)">
                <img src="SpacegameIngame.png" alt="Image 2" onclick="openModal(this.src)">
            </div>
        </div>

        <div class="game-videos">
            <h2>Game Videos</h2>
            <video controls>
                <source src="Space Endless 2D.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="modalImage" src="">
    </div>

    <script>
        function openModal(imageSrc) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
</html>
